[tool.poetry]
name = "pyla-linter"
version = "1.0.0"
description = "Python linter for LangAdventure products"
authors = ["LangAdventure"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pyla-logger = "^1.0.0"

[tool.poetry.group.dev.dependencies]
black = "^23.1.0"
isort = "^5.12.0"
pylama = {extras = ["toml"], version = "^8.4.1"}
poethepoet = "^0.21.0"
setuptools = "^75.8.0"
pyright = "^1.1.402"
pytest = "^8.4.0"
pytest-mock = "^3.14.1"

[[tool.poetry.source]]
name = "gcp"
url = "https://us-west1-python.pkg.dev/langadventure-shared-common/langadventure-python/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "gcp-pub"
url = "https://us-west1-python.pkg.dev/langadventure-shared-common/langadventure-python/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "src"
filterwarnings = "ignore::DeprecationWarning"
addopts = "--ignore=temp"
testpaths = ["src/tests"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
force_grid_wrap = 0
line_length = 100
src_paths = ["src"]

[tool.black]
line-length = 100

[tool.pyright]
include = ["src"]
exclude = ["bin", "temp", ".venv"]

[tool.poe.tasks]
black = "black ."
isort = "isort ."
lint = "pylama"
format = ["black", "isort"]
autolint = ["black", "isort", "lint"]

[tool.poetry.plugins."pylama.linter"]
length_checker = "src.linters.length_checker.plugin:LengthCheckerPlugin"

[tool.pyla-linters]
# Length Checker Plugin Configuration
# 
# Maximum lines for functions (excluding docstrings, comments, and empty lines)
# Default: 40 lines
max_function_length = 40

# Maximum lines for classes (excluding docstrings, comments, and empty lines)
# Default: 200 lines  
max_class_length = 200

# Example configurations for different coding standards:
#
# Strict configuration (smaller functions/classes):
# max_function_length = 20
# max_class_length = 100
#
# Relaxed configuration (larger functions/classes):
# max_function_length = 60
# max_class_length = 300
